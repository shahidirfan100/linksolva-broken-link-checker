name: Plugin quality

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax and release metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l

      - name: Run scan time-limit regression check
        run: php tests/scan-time-limit.php

      - name: Run scan history retention regression check
        run: php tests/scan-history.php

      - name: Check admin JavaScript syntax
        run: node --check assets/js/admin.js

      - name: Check scan status renderer
        run: node tests/scan-status-ui.js

      - name: Check findings filter display
        run: node tests/findings-filters-ui.js

      - name: Check release version consistency
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          plugin = pathlib.Path('linksolva-broken-link-checker.php').read_text()
          readme = pathlib.Path('readme.txt').read_text()
          header = re.search(r'^ \* Version:\s+(\S+)$', plugin, re.MULTILINE)
          stable = re.search(r'^Stable tag:\s+(\S+)$', readme, re.MULTILINE)
          if not header or not stable or header.group(1) != stable.group(1):
              sys.exit('Plugin header version and readme stable tag must match.')
          if f"= {header.group(1)} =" not in readme:
              sys.exit('The current version is missing from the readme changelog.')
          print(f'Release metadata matches: {header.group(1)}')
          PY

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble the WordPress.org plugin package
        run: |
          package_dir="build/linksolva-broken-link-checker"
          mkdir -p "$package_dir"
          git archive --format=tar HEAD -- . \
            ':(exclude).github' \
            ':(exclude)ROADMAP.md' \
            ':(exclude)tests' \
            ':(exclude).gitignore' \
            ':(exclude)wordpress-org-assets' |
            tar -xf - -C "$package_dir"

      - name: Run the official Plugin Check suite
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: ./build/linksolva-broken-link-checker
          wp-version: latest
          strict: true

  wordpress-integration:
    name: WordPress scan integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, dom, mbstring
          coverage: none
      - name: Set up disposable WordPress site
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp.phar
          mkdir -p /tmp/linksolva-wp
          php /tmp/wp.phar core download --path=/tmp/linksolva-wp --quiet
          php /tmp/wp.phar config create --path=/tmp/linksolva-wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_DISPLAY', true );
          PHP
          php /tmp/wp.phar core install --path=/tmp/linksolva-wp --url=http://localhost --title=Test --admin_user=admin --admin_password=test-password --admin_email=admin@example.com --skip-email
          mkdir -p /tmp/linksolva-wp/wp-content/plugins/linksolva-broken-link-checker
          cp -R . /tmp/linksolva-wp/wp-content/plugins/linksolva-broken-link-checker/
          php /tmp/wp.phar plugin activate linksolva-broken-link-checker --path=/tmp/linksolva-wp
      - name: Measure a synthetic 2,000-URL scan and history snapshot
        run: php /tmp/wp.phar eval-file tests/benchmark-scan.php --path=/tmp/linksolva-wp
      - name: Measure sparse 30,000-job discovery
        run: php /tmp/wp.phar eval-file tests/benchmark-large-sparse.php --path=/tmp/linksolva-wp
      - name: Check duplicate sources and no-progress recovery
        run: php /tmp/wp.phar eval-file tests/integration-duplicate-scan.php --path=/tmp/linksolva-wp
      - name: Check discovery database failures
        run: php /tmp/wp.phar eval-file tests/integration-discovery-failure.php --path=/tmp/linksolva-wp
      - name: Exercise real scan and history failure
        run: php /tmp/wp.phar eval-file tests/integration-scan.php --path=/tmp/linksolva-wp

  browser-screenshots:
    name: Browser checks and screenshots
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, dom, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create a disposable WordPress site
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp.phar
          mkdir -p /tmp/linksolva-ui-wp/wp-content/plugins/linksolva-broken-link-checker
          php /tmp/wp.phar core download --path=/tmp/linksolva-ui-wp --quiet
          php /tmp/wp.phar config create --path=/tmp/linksolva-ui-wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP
          php /tmp/wp.phar core install --path=/tmp/linksolva-ui-wp --url=http://127.0.0.1:8080 --title='LinkSolva Sample Site' --admin_user=admin --admin_password=test-password --admin_email=admin@example.com --skip-email
          cp -R . /tmp/linksolva-ui-wp/wp-content/plugins/linksolva-broken-link-checker/
          php /tmp/wp.phar plugin activate linksolva-broken-link-checker --path=/tmp/linksolva-ui-wp
          php /tmp/wp.phar eval-file tests/screenshot-fixture.php --path=/tmp/linksolva-ui-wp
          php -S 127.0.0.1:8080 -t /tmp/linksolva-ui-wp >/tmp/linksolva-ui-server.log 2>&1 &
      - name: Install browser
        run: |
          npm install --prefix /tmp/linksolva-ui playwright@1.55.1
          /tmp/linksolva-ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Check dashboard and capture screenshots
        env:
          NODE_PATH: /tmp/linksolva-ui/node_modules
        run: |
          node tests/screenshot-ui.cjs
          if [ -s /tmp/linksolva-ui-wp/wp-content/debug.log ]; then cat /tmp/linksolva-ui-wp/wp-content/debug.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linksolva-screenshots
          path: screenshots/
          if-no-files-found: warn
